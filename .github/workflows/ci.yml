name: Verify Relay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser verifier
        run: npm install --no-save --package-lock=false --no-audit --no-fund puppeteer@25.16.0
      - name: Locate Chromium
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(await puppeteer.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run probe
      - run: npm run probe:commerce
